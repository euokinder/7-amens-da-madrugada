<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 Améns da Madrugada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
<link rel="apple-touch-icon" href="assets/images/icon-180.png">
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='novena.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      <span>Voltar</span>
    </button>
    <div class="avatar"><img src="assets/images/icon-96.png" alt="7 Améns da Madrugada" width="44" height="44"></div>
  </div>

  <div class="content" id="content">
    <p class="subtext">Carregando...</p>
  </div>

</div>

<script src="js/dias.js?v=6"></script>
<script src="js/materiais.js?v=3"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const materialKey = params.get('material');
  const diaNum = parseInt(params.get('dia'), 10);
  const dia = materialKey ? MATERIAIS[materialKey] : DIAS[diaNum];
  const content = document.getElementById('content');
  const temVideo = !materialKey || (dia && dia.temVideo === true);

  if (!dia || (!materialKey && !dia.disponivel)) {
    content.innerHTML = `
      <div class="heading-block">
        <h1 class="title" style="font-size:22px;">Conteúdo indisponível</h1>
        <p class="subtext">Esse conteúdo ainda não foi liberado. Volte para a lista de orações.</p>
      </div>
    `;
  } else {
    const playIcon = '<svg width="26" height="26" viewBox="0 0 24 24" fill="var(--dark-on-accent)"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>';

    let videoHtml = '';
    let videoScriptSrc = '';
    if (temVideo) {
      if (dia.videoEmbed) {
        videoHtml = `<div class="video-wrap-embed">${dia.videoEmbed.html}</div>`;
        videoScriptSrc = dia.videoEmbed.scriptSrc;
      } else if (dia.videoId) {
        videoHtml = `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${dia.videoId}" title="${dia.titulo}" allowfullscreen></iframe></div>`;
      } else {
        videoHtml = `<div class="video-wrap"><div class="play-btn">${playIcon}</div></div>`;
      }
    }

    const materialHtml = dia.materialPdf
      ? `<button class="material-btn" type="button" onclick="window.open('${dia.materialPdf}', '_blank')">
           <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z"/><path d="M14 3.5v4h4"/></svg>
           ${dia.materialLabel}
         </button>`
      : `<p class="subtext" style="text-align:center;">Esse material ainda não foi adicionado.</p>`;

    const materialExtraHtml = dia.materialExtraPdf
      ? `<button class="material-btn" type="button" onclick="window.open('${dia.materialExtraPdf}', '_blank')">
           <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13Z"/></svg>
           ${dia.materialExtraLabel}
         </button>`
      : '';

    const descricaoHtml = dia.descricao
      ? `<p style="margin:0;font-size:15px;font-weight:500;line-height:1.7;color:var(--ink);">${dia.descricao}</p>`
      : '';

    let oracaoHtml = '';
    if (dia.oracao) {
      const blocos = dia.oracao.blocos
        .map((b) => `<p>${b.replace(/\n/g, '<br>')}</p>`)
        .join('');
      oracaoHtml = `
        <div style="display:flex;flex-direction:column;gap:14px;">
          <h2 class="section-label" style="margin:0;">A oração</h2>
          <div class="prayer-card">
            <p class="opening">${dia.oracao.abertura}</p>
            ${blocos}
            <p class="closing">${dia.oracao.fechamento}</p>
          </div>
        </div>
      `;
    }

    const proximoHtml = dia.proximo
      ? `<p class="subtext" style="text-align:center;">${dia.proximo}</p>`
      : '';

    content.innerHTML = `
      <span class="kicker">${dia.kicker}</span>
      <div class="section-heading" style="margin-top:-8px;">
        <div class="bar"></div>
        <div class="heading-block">
          <h1 class="title" style="font-size:22px;">${dia.titulo}</h1>
          <p class="subtext">${dia.subtitulo}</p>
        </div>
      </div>

      ${videoHtml}

      ${descricaoHtml}

      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        ${materialHtml}
        ${materialExtraHtml}
      </div>

      ${oracaoHtml}

      ${proximoHtml}

      <div class="banner">
        <span>Faça as orações na ordem e nos horários corretos</span>
      </div>
    `;

    if (videoScriptSrc) {
      const playerScript = document.createElement('script');
      playerScript.src = videoScriptSrc;
      playerScript.async = true;
      document.head.appendChild(playerScript);
    }
  }
</script>
<script src="js/app.js?v=3"></script>
</body>
</html>
